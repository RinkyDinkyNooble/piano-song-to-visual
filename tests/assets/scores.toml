# MusicXML test-score assets.
#
# These come from the Unofficial MusicXML Test Suite, a set of small files each
# built to exercise one corner of the format. They are worth far more to a
# parser than a real piece is: a real score exercises whatever it happens to
# contain, while these exercise the things that are easy to get wrong.
#
# NOT COMMITTED, for the same reason the CC BY-SA songs are not. The suite is
# MIT, which is a permissive licence but still a conditional one: it requires
# the copyright notice to travel with the files. This repository is 0BSD and
# imposes no conditions on anyone downstream, so carrying MIT files inside it
# would quietly attach an obligation that the repository's own licence says is
# not there. They are fetched instead, with `python scripts/fetch_test_scores.py`.
#
# Tests that need them skip when they are absent. Continuous integration runs
# without them and covers the parser with the generated fixtures in
# tests/fixtures/musicxml_builder.py, which are ours and carry no licence at
# all.

source = "Unofficial MusicXML Test Suite"
licence = "MIT"
homepage = "https://github.com/w3c-cg/musicxmlTestSuite"
base_url = "https://raw.githubusercontent.com/w3c-cg/musicxmlTestSuite/main/xmlFiles"

# Each entry names why it is here. A file that does not test something this
# parser can get wrong is not worth fetching.

