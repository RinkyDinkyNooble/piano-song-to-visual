# Feature registry.
#
# One entry per user-visible feature, which means something the tool promises in
# the README, the spec, or docs/ARCHITECTURE.md. Not internal functions: those
# are covered by ordinary unit tests and do not belong here.
#
# tests/test_feature_coverage.py enforces two rules against this file:
#
#   1. Every feature with status = "done" has at least one test marked
#      @pytest.mark.feature("F-xx"). A feature cannot be called finished until
#      something proves it end to end.
#   2. Every feature id used in a test marker exists here. Catches typos and
#      stops coverage from silently pointing at nothing.
#
# Flip status from "planned" to "done" in the same change that lands the tests.
# The suite fails if you flip it early, which is the point.
#
# `verify` says how the feature is proven:
#   e2e      - drives the CLI or full pipeline on a real file
#   property - hypothesis generates inputs and asserts an invariant
#   unit     - exercised through one module's public interface
#   visual   - compared against a committed reference image

