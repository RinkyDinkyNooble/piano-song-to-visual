name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Deliberately no FORCE_COLOR. It buys prettier logs and costs correctness:
  # Python 3.14 colours argparse help, so forcing colour on a non-terminal makes
  # the CLI emit ANSI escapes that tests then have to see past. NO_COLOR keeps
  # every tool honest about not writing to a terminal.
  NO_COLOR: "1"

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # No network in the test job: the two public-domain songs are committed,
      # and tests needing the gitignored CC BY-SA pair skip themselves.
      - run: python scripts/fetch_test_songs.py --check
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pytest --cov --cov-report=term-missing 2>&1 | tee pytest-output.txt
      # A failing matrix job's log needs repository admin rights to download,
      # so a red build is unreadable to everyone except the owner. Two ways out,
      # because they are visible to different readers: the step summary renders
      # on the run page for a person, and the error annotation is served by the
      # public checks API for anything reading the repository over HTTP.
      #
      # What goes in them is chosen rather than tailed. An annotation is capped
      # at about 4kB, and a coverage table is 3kB of it, so tailing the output
      # once produced a red build reporting only how well covered the code was.
      # The failures come first now, and the coverage table is dropped.
      - name: Publish the failure
        if: failure()
        shell: bash
        run: |
          # The names of what broke, then the traceback for the first few.
          grep -E '^(FAILED|ERROR) ' pytest-output.txt > failed.txt || true
          sed -n '/^=* FAILURES =*$/,/^=* \(warnings summary\|short test\)/p' \
            pytest-output.txt > tracebacks.txt || true

          {
            echo "### ${{ matrix.os }}, Python ${{ matrix.python-version }}"
            echo
            echo '```'
            cat failed.txt
            echo
            tail -n 200 tracebacks.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # One annotation, not sixty: a step is allowed ten, and the newlines
          # have to be escaped as %0A to survive inside a workflow command.
          body=$( { cat failed.txt; echo; tail -n 40 tracebacks.txt; } \
            | head -c 3500 \
            | sed -e 's/%/%25/g' -e 's/\r//g' \
            | awk '{printf "%s%%0A", $0}')
          echo "::error title=pytest ${{ matrix.os }} py${{ matrix.python-version }}::${body}"

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
