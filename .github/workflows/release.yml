name: Release

# Publishing is driven by a tag, so what went to PyPI is always a commit you
# can point at. There is no manual trigger: a release you can start from a
# button is a release nobody can find the source of afterwards.
on:
  push:
    tags: ["v*"]

# No API token anywhere in this file, and none in the repository's secrets.
# PyPI is configured to trust this workflow, in this repository, through OIDC:
# the `id-token: write` permission below is what lets the job ask GitHub for a
# short-lived identity token, which PyPI exchanges for an equally short-lived
# upload token. Nothing long-lived exists to leak.
permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  NO_COLOR: "1"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: pip install build twine

      # The tag and the package have to agree. Without this, `git tag v1.0.2`
      # on a tree that still says 1.0.1 uploads 1.0.1, which either collides
      # with what is already on PyPI or, worse, does not and leaves a release
      # whose tag names a version it does not contain. PyPI will not let either
      # be corrected afterwards.
      - name: Check the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import re,pathlib;
          print(re.search(r'__version__ = \"([^\"]+)\"',
          pathlib.Path('src/psv/__init__.py').read_text()).group(1))")
          echo "tag=$tag version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi

      - run: python -m build
      - run: twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Named so PyPI's trusted publisher can be pinned to it, and so the
    # repository can require a review before anything is uploaded. Both of
    # those are settings outside this file; the name is the hook they hang on.
    environment:
      name: pypi
      url: https://pypi.org/p/piano-song-to-visual
    permissions:
      id-token: write # the OIDC token, and the only permission needed to upload
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
